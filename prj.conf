#################################
#### F Prime: Dependencies   ####
####     Required by F Prime ####
#################################
CONFIG_CPP=y
    # F Prime requires CPP...
CONFIG_REQUIRES_FULL_LIBCPP=y
    # ...in full capacity
CONFIG_COMMON_LIBC_MALLOC=y
    # LIBC malloc calls are needed for Fw::MemAllocator
    # CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE is deliberately left unset (auto, -1,
    # sizes the heap to all RAM remaining after _end). A fixed static arena crashes
    # boot earlier than the auto-sized heap running low does -- likely an MPU
    # region/placement issue, not a capacity issue. Free heap headroom via queue
    # depths (see config/rp2350-overrides/*.fpp) instead of a static arena.
CONFIG_DYNAMIC_THREAD=y
    # Threads are built at runtime...
CONFIG_DYNAMIC_THREAD_ALLOC=n
    # ...not through dynamic allocation...
CONFIG_DYNAMIC_THREAD_PREFER_POOL=y
    # ...but by a preallocated pool
CONFIG_THREAD_STACK_INFO=y
    # Required by CONFIG_DYNAMIC_THREAD on some systems
CONFIG_KERNEL_MEM_POOL=y
    # Kernel has its own memory pool
CONFIG_REBOOT=y
    # Fatal handler uses reboot
CONFIG_RING_BUFFER=y
    # Ring buffer is used by the UART driver

###################################################################
#### F Prime: tunable options                                  ####
####     Required by F Prime, values determined by application ####
###################################################################
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192
    # Give every dynamically-created F Prime task the upstream-proven 8 KiB stack.
    # config/rp2350-overrides/CdhCoreConfig.fpp independently pins cmdDisp/events/
    # tlmSend's stacks to a hardcoded 8*1024, so this can't be shrunk without also
    # changing that file -- any mismatch fails k_thread_stack_alloc() with
    # ERROR_RESOURCES for those three tasks. Free heap headroom via queue depths
    # (see config/rp2350-overrides/*.fpp) rather than shrinking this.
    #
    # CAUTION: this must be exactly equal to every thread stack size in the system.
    #
    # TIP: this will manifest as an ASSERTION failure in ActiveComponentBase when inconsistent.
CONFIG_MAIN_STACK_SIZE=8192
    # Keep extra headroom for deployment construction and initialization on main.
    # (Independent of CONFIG_DYNAMIC_THREAD_STACK_SIZE above -- this is main()'s own
    # stack, not an F Prime active-component task stack, so it isn't part of the
    # "must match" constraint and wasn't reduced along with it.)
CONFIG_DYNAMIC_THREAD_POOL_SIZE=19
    # The complete deployment starts 19 active-component threads (verified against
    # the .start() calls generated in rp2350DeploymentTopologyAc.cpp::startTasks()).
    # Kept exact rather than padded: each slot costs a full CONFIG_DYNAMIC_THREAD_STACK_SIZE
    # (8 KiB) of RAM, and this pool doesn't support mixed stack sizes.
    #
    # CAUTION: Make sure that this is >= the number of active components + user threads in the system.
    #
    # TIP: this will manifest as an ASSERTION failure in ActiveComponentBase when inconsistent.
CONFIG_ASSERT=y
    # F Prime FW_ASSERT requires asserts. This can be turned off when FW_ASSERT is turned off.
CONFIG_CPP_EXCEPTIONS=n
    # F Prime typically disables CPP exceptions as this is flight practice.
CONFIG_CPP_RTTI=n
    # F Prime typically disables RTTI as this is flight practice.
CONFIG_FILE_SYSTEM=y
    # Enable file system support. This can be disabled, however; the Os_File selection would need to be
    # set to Os_File_Stub

#########################################
#### Application: USB UART console   ####
#########################################
CONFIG_CONSOLE=y
    # Enable the Zephyr console
CONFIG_SERIAL=y
    # Enable Zephyr Serial support
CONFIG_UART_CONSOLE=y
    # Enable UART console
CONFIG_UART_LINE_CTRL=y
    # Support the USB CDC DTR/line-control state used by host serial clients
CONFIG_USB_DEVICE_STACK_NEXT=y
    # Use modern USBD stack
CONFIG_USBD_CDC_ACM_CLASS=y
    # Configure USBD to only support CDC ACM UART
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=y
    # Enabled at boot time
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
    # Initialized at boot time
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="F Prime UART Communication"
    # CDC ACM description string
CONFIG_CDC_ACM_SERIAL_PID=0x0004
CONFIG_CDC_ACM_SERIAL_VID=0x2FE3
    # Zephyr's CDC ACM sample IDs, suitable only for local development.
    # Assign a project-owned VID/PID before distributing hardware.

#########################################
#### Application: Device support     ####
#########################################
CONFIG_GPIO=y
    # Required: rp2350DeploymentTopology.cpp unconditionally references the gpio0
    # device via GPIO_DT_SPEC_GET for the subsystem power-enable pins. Without this,
    # that reference is left undefined and the link fails outright.
CONFIG_PWM=n
    # Disable PWM, set to 'y' to enable
CONFIG_I2C=y
    # Required by Zephyr::ZephyrI2cDriver (Billee::McpManager reads the on-board
    # MCP9808 temp sensors over I2C1). I2C0 is wired in the board overlay
    # (GPIO0/1, INA telemetry bus) but no F Prime component uses it yet.
CONFIG_SPI=n
    # Disable SPI, set to 'y' to enable
CONFIG_PINCTRL=y
    # Enable pin control. Pin control is
    # typically used by the Device Tree.

#########################################
#### Application: Feature support    ####
#########################################
CONFIG_PRINTK=y
    # Enable printk, useful for debugging
#CONFIG_BUILD_OUTPUT_UF2=y
    # Pico2 requires UF2 format
