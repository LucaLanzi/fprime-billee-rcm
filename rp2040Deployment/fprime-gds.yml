# This is a configuration file for the F´ GDS application.
#
# Run from the rp2040Deployment directory with:
#   ../fprime-venv/bin/fprime-gds

command-line-options:
  no-app:
  dictionary: ../build-artifacts/zephyr/fprime-zephyr-deployment/dict/rp2040DeploymentTopologyDictionary.json
  communication-selection: uart
  framing-selection: fprime
  uart-device: /dev/ttyACM0
  uart-baud: 115200
